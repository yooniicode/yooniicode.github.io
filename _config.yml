# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Theme Settings
#
# Review documentation to determine if you should use `theme` or `remote_theme`
# https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/#installing-the-theme

# theme                  : "minimal-mistakes-jekyll"
# 테마 파일(_layouts/_includes/_sass)을 이 저장소에 직접 두고 쓴다.
# remote_theme 을 함께 켜두면 GitHub Pages 에서만 원격 테마가 끼어들어
# 로컬 빌드와 결과가 갈릴 수 있으므로 쓰지 않는다.
minimal_mistakes_skin    : "default" # "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Site Settings
locale                   : "ko"
rtl                      : # true, false (default) # turns direction of the page into right to left for RTL languages
title                    : "YooniCode"
title_separator          : "-"
subtitle                 : # site tagline that appears below site title in masthead
name                     : "Yoonji Lee"
description              : "A blog about programming, technology, and life. ( •̀ ω •́ )y"
url                      : "https://yooniicode.site"
baseurl                  : ""
repository               : "yooniicode/yooniicode.github.io"
teaser                   : # path of fallback teaser image, e.g. "/assets/images/500x300.png"
logo                     : # path of logo image to display in the masthead, e.g. "/assets/images/88x88.png"
masthead_title           : # overrides the website title displayed in the masthead, use " " for no title
breadcrumbs              : true
words_per_minute         : 200
enable_copy_code_button  : true
copyright                : # "copyright" name, defaults to site.title
copyright_url            : # "copyright" URL, defaults to site.url
comments:
  provider               : "giscus" # false (default), "disqus", "discourse", "facebook", "staticman", "staticman_v2", "utterances", "giscus", "custom"
  disqus:
    shortname            : # https://help.disqus.com/customer/portal/articles/466208-what-s-a-shortname-
  discourse:
    server               : # https://meta.discourse.org/t/embedding-discourse-comments-via-javascript/31963 , e.g.: meta.discourse.org
  facebook:
    # https://developers.facebook.com/docs/plugins/comments
    appid                :
    num_posts            : # 5 (default)
    colorscheme          : # "light" (default), "dark"
  utterances:
    theme                : # "github-light" (default), "github-dark"
    issue_term           : # "pathname" (default)
  giscus:
    # repo_id / category_id 는 GitHub GraphQL API 로 조회한 실제 값
    # (gh api graphql -f query='{ repository(owner:"yooniicode", name:"yooniicode.github.io") { id } }')
    repo_id              : "R_kgDOLWRtYg"
    # Announcements 카테고리: 방문자는 댓글만 달 수 있고 새 토론 생성은 관리자만.
    # giscus 공식 권장 설정이며 스팸 토론이 쌓이는 걸 막는다.
    category_name        : "Announcements"
    category_id          : "DIC_kwDOLWRtYs4DFCS-"
    # 글 URL 경로로 토론을 매칭. 글 제목을 바꿔도 댓글이 유지된다.
    discussion_term      : "pathname"
    reactions_enabled    : '1'
    theme                : "light"
    # 경로가 정확히 일치할 때만 매칭 — 비슷한 경로끼리 댓글이 섞이는 걸 방지
    strict               : '1'
    # 기존 댓글을 먼저 읽고 그 아래에서 입력 — 읽기 흐름에 맞음
    input_position       : "bottom"
    emit_metadata        : # 1 for enabled, 0 for disabled (default) # https://github.com/giscus/giscus/blob/main/ADVANCED-USAGE.md#imetadatamessage
    lang                 : "ko"
    # 댓글 영역 근처까지 스크롤해야 로드 — 글 본문 초기 로딩을 막지 않는다
    lazy                 : true
  staticman:
    branch               : # "master"
    endpoint             : # "https://{your Staticman v3 API}/v3/entry/github/"
reCaptcha:
  siteKey                :
  secret                 :
atom_feed:
  path                   : # blank (default) uses feed.xml
  hide                   : # true, false (default)
search                   : true
search_full_content      : true # true, false (default)
search_provider          : # lunr (default), algolia, google
lunr:
  search_within_pages    : # true, false (default)
algolia:
  application_id         : # YOUR_APPLICATION_ID
  index_name             : # YOUR_INDEX_NAME
  search_only_api_key    : # YOUR_SEARCH_ONLY_API_KEY
  powered_by             : # true (default), false
google:
  search_engine_id       : # YOUR_SEARCH_ENGINE_ID
  instant_search         : # false (default), true
# SEO Related
google_site_verification :
bing_site_verification   :
naver_site_verification  :
yandex_site_verification :
baidu_site_verification  :

# Social Sharing
twitter:
  username               :
facebook:
  username               :
  app_id                 :
  publisher              :
og_image                 : "/assets/images/muffin.jpg" # Open Graph/Twitter default site image
# For specifying social profiles
# - https://developers.google.com/structured-data/customize/social-profiles
social:
  type                   : # Person or Organization (defaults to Person)
  name                   : # If the user or organization name differs from the site's name
  links: # An array of links to social media profiles

# Analytics
analytics:
  provider               : # false (default), "google", "google-universal", "google-gtag", "custom"
  google:
    tracking_id          :
    anonymize_ip         : # true, false (default)


# Site Author
author:
  name             : "Yoonji Lee"
  avatar           : "/assets/images/muffin.jpg"
  bio              : "이게 왜 되지"
  location         : "Seoul, South Korea"
  email            :
  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope-square"
      url: "mailto:estelle0329@ewha.ac.kr"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yooniicode"
    - label: "Instagram"
      icon: "fab fa-fw fa-instagram"
      url: "https://instagram.com/pdxvhdx"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/yooniicode/"
    - label: "Portfolio"
      icon: "fas fa-fw fa-briefcase"
      url: "https://portfolio.yooniicode.site/"

# Site Footer
footer:
  # footer.html 은 label 과 url 이 둘 다 있는 항목만 렌더링한다.
  # url 없는 항목은 화면에 나오지 않으므로 두지 않는다.
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/yooniicode"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/yooniicode/"
    - label: "Portfolio"
      icon: "fas fa-fw fa-briefcase"
      url: "https://portfolio.yooniicode.site/"
  since                  : "2023"
# Reading Files
include:
  - .htaccess
  - _pages
exclude:
  # 빌드 산출물에 섞이면 안 되는 것들만 남긴다.
  # (테마 포크 잔재였던 docs/ test/ Rakefile gemspec 등은 저장소에서 제거됨)
  - vendor
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - assets/js/plugins      # main.min.js 로 번들되는 원본
  - assets/js/_main.js     #  ↳ 같이 번들되는 원본
  - assets/js/vendor
  - node_modules
  - package.json
  - package-lock.json
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"


# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false


# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false


# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style
  # 테마(minimal-mistakes)가 번들한 susy/breakpoint 라이브러리가 구버전 Sass 문법을 써서
  # deprecation 경고가 230건씩 쏟아진다. 내가 고칠 수 없는 남의 코드이므로 의존성 경고만 숨긴다.
  # (assets/css/main.scss 등 내가 직접 쓴 파일의 경고는 그대로 표시됨)
  quiet_deps: true
  # main.scss가 테마를 불러올 때 쓰는 @import 문법도 deprecated 상태다.
  # 후속 문법인 @use 로 바꾸려면 테마가 먼저 대응해야 하므로(현재 미지원) 경고만 끈다.
  # → Dart Sass 3.0 에서 @import 가 실제로 제거되면 그때 테마 업데이트 필요.
  silence_deprecations:
    - import


# Outputting
permalink: /:categories/:title/
timezone: Asia/Seoul


# Pagination with jekyll-paginate
paginate: 5 # amount of posts to show
paginate_path: /page:num/

# Pagination with jekyll-paginate-v2
# See https://github.com/sverrirs/jekyll-paginate-v2/blob/master/README-GENERATOR.md#site-configuration
#   for configuration details
# Plugins (previously gems:)
plugins:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-redirect-from
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache


# Archives
#  Type
#  - GitHub Pages compatible archive pages built with Liquid ~> type: liquid (default)
#  - Jekyll Archives plugin archive pages ~> type: jekyll-archives
#  Path (examples)
#  - Archive page should exist at path when using Liquid method or you can
#    expect broken links (especially with breadcrumbs enabled)
#  - <base_path>/tags/my-awesome-tag/index.html ~> path: /tags/
#  - <base_path>/categories/my-awesome-category/index.html ~> path: /categories/
#  - <base_path>/my-awesome-category/index.html ~> path: /
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
# https://github.com/jekyll/jekyll-archives
# jekyll-archives:
#   enabled:
#     - categories
#     - tags
#   layouts:
#     category: archive-taxonomy
#     tag: archive-taxonomy
#   permalinks:
#     category: /categories/:name/
#     tag: /tags/:name/


# HTML Compression
# - https://jch.penibelst.de/
compress_html:
  clippings: all
  ignore:
    envs: development


# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      comments: true
      share: true
      related: true
  
  # _pages
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
