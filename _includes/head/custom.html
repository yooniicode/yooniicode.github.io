<!-- start custom head snippets -->

<!-- 외부 폰트/아이콘 도메인 커넥션을 문서 파싱 초기에 미리 열어둔다.
     (DNS + TCP + TLS 왕복을 CSS 요청 전에 끝내서 폰트 표시 시점을 앞당김) -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- 본문 폰트: Pretendard
     - @v1.3.9 로 버전 고정 (미고정 시 기본 브랜치 최신을 받아 캐시/재현성이 깨짐)
     - dynamic-subset: 페이지에 실제로 쓰인 글자가 속한 조각만 내려받음.
       한글 전체 웨이트를 받는 static 판 대비 초기 전송량이 크게 줄어든다. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<!-- 코드 폰트: Fira Code (main.scss 의 code/pre 선언이 이 로드에 의존한다) -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&display=swap">

<!-- 모바일 브라우저 주소창/상단바 색을 페이지 배경과 맞춤 -->
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">

<!-- 파비콘 — 원본은 사이트 프로필/og:image 와 같은 assets/images/muffin.jpg.
     /favicon.ico 는 브라우저가 링크 없이도 요청하므로 사이트 루트에 따로 둔다. -->
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon/favicon-32x32.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon/favicon-16x16.png' | relative_url }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/favicon/apple-touch-icon.png' | relative_url }}">
<link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">

<!-- end custom head snippets -->
